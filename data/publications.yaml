- title: "Peroxide: A Batteries-Included Numerical Computing Library for Rust"
  journal: "J. Open Source Softw."
  year: 2026
  authors: ["Tae-Geun Kim", "Giorgio Comitini", "Jonas Grage", "Benjamin Joens", "Marc Schreiber", "Soumya Sen", "Russell R P Senthamarai", "Johanna Sörngård"]
  tags: ["Scientific Computing", "Rust", "Open Source Software"]
  doi: "10.21105/joss.10366"
  code: "https://github.com/Axect/Peroxide"
  abstract: "Peroxide is a Rust numerical computing library that integrates eight domains in one crate: linear algebra, ordinary differential equation (ODE) solving, adaptive quadrature, spline interpolation with exact polynomial calculus, root-finding, forward-mode automatic differentiation (AD), statistics, and multi-format DataFrame I/O. We designed Peroxide for applied scientists, engineers, and students who need a cohesive numerical environment in Rust without assembling a multi-crate dependency graph."
  bibtex: |
    @article{kim2026peroxide,
      title={Peroxide: A Batteries-Included Numerical Computing Library for Rust},
      author={Kim, Tae-Geun and Comitini, Giorgio and Grage, Jonas and Joens, Benjamin and Schreiber, Marc and Sen, Soumya and Senthamarai, Russell R P and S{\"o}rng{\aa}rd, Johanna},
      journal={Journal of Open Source Software},
      volume={11},
      number={124},
      pages={10366},
      year={2026},
      doi={10.21105/joss.10366}
    }

- title: "Primordial Black Holes as a Factory of Axions: Extragalactic Photons from Axions"
  journal: "Prog. Theor. Exp. Phys."
  year: 2026
  authors: ["Yongsoo Jho", "Tae-Geun Kim", "Jong-Chul Park", "Seong Chan Park", "Yeji Park"]
  tags: ["Dark Matter", "PBH", "Axion"]
  doi: "10.1093/ptep/ptag011"
  arxiv: "2212.11977"
  abstract: "Primordial black holes (PBHs) are significant sources of axions and axion-like particles, provided their Hawking temperature exceeds the particles’ masses. Given the predominant decay of axions into photons, the enhanced photon spectrum they generate can be feasibly detected using sensitive detectors. This paper introduces a novel methodology that elucidates the decay process by which particles traverse and decay over cosmological timescales."
  bibtex: |
    @article{jho2026primordial,
      title={Primordial Black Holes as a Factory of Axions: Extragalactic Photons from Axions},
      author={Jho, Yongsoo and Kim, Tae-Geun and Park, Jong-Chul and Park, Seong Chan and Park, Yeji},
      journal={Progress of Theoretical and Experimental Physics},
      volume={2026},
      number={2},
      pages={023B07},
      year={2026},
      doi={10.1093/ptep/ptag011}
    }

- title: "Learning Unknown Gravitational Fields for Spacecraft State Estimation: Temporal Hamiltonian Neural Network-based Adaptive Kalman Filtering"
  journal: "Under review at IEEE TAES"
  year: 2025
  authors: ["Taehyeun Kim", "Tae-Geun Kim", "Anouck Girard", "Ilya Kolmanovsky"]
  tags: ["Machine Learning", "Hamiltonian", "Bayesian"]
  arxiv: "2501.18808"
  abstract: "Earlier version on arXiv as \"Learning Hamiltonian Dynamics with Bayesian Data Assimilation\": In this paper, we develop a neural network-based approach for time-series prediction in unknown Hamiltonian dynamical systems. Our approach leverages a surrogate model and learns the system dynamics using generalized coordinates (positions) and their conjugate momenta while preserving a constant Hamiltonian. Additionally, we employ Bayesian data assimilation to refine predictions in real-time using online measurement data."
  bibtex: |
    @article{kim2025learning,
      title={Learning Hamiltonian Dynamics with Bayesian Data Assimilation},
      author={Kim, Taehyeun and Kim, Tae-Geun and Girard, Anouck and Kolmanovsky, Ilya},
      journal={arXiv preprint arXiv:2501.18808},
      year={2025}
    }

- title: "Neural Hamilton: Can A.I. Understand Hamiltonian Mechanics?"
  journal: "arXiv preprint"
  year: 2024
  authors: ["Tae-Geun Kim", "Seong Chan Park"]
  tags: ["Machine Learning", "Operator Learning", "Hamiltonian"]
  arxiv: "2410.20951"
  code: "https://github.com/Axect/Neural_Hamilton"
  abstract: "We propose a novel framework based on neural network that reformulates classical mechanics as an operator learning problem. A machine directly maps a potential function to its corresponding trajectory in phase space without solving the Hamilton equations. Most notably, while conventional methods tend to accumulate errors over time through iterative time integration, our approach prevents error propagation."
  bibtex: |
    @article{kim2024neural,
      title={Neural Hamilton: Can A.I. Understand Hamiltonian Mechanics?},
      author={Kim, Tae-Geun and Park, Seong Chan},
      journal={arXiv preprint arXiv:2410.20951},
      year={2024}
    }

- title: "HyperbolicLR: Epoch insensitive learning rate scheduler"
  journal: "arXiv preprint"
  year: 2024
  authors: ["Tae-Geun Kim"]
  tags: ["Machine Learning", "Optimization"]
  arxiv: "2407.15200"
  abstract: "This study proposes two novel learning rate schedulers, Hyperbolic Learning Rate Scheduler (HyperbolicLR) and Exponential Hyperbolic Learning Rate Scheduler (ExpHyperbolicLR), to address the epoch sensitivity problem that often causes inconsistent learning curves in conventional methods. By leveraging the asymptotic behavior of hyperbolic curves, the proposed schedulers maintain more stable learning curves across varying epoch settings."
  bibtex: |
    @article{kim2024hyperboliclr,
      title={HyperbolicLR: Epoch insensitive learning rate scheduler},
      author={Kim, Tae-Geun},
      journal={arXiv preprint arXiv:2407.15200},
      year={2024}
    }

- title: "Unsupervised sequence-to-sequence learning for automatic signal quality assessment in multi-channel electrical impedance-based hemodynamic monitoring"
  journal: "Comput. Meth. Prog. Bio."
  year: 2024
  authors: ["Chang Min Hyun", "Tae-Geun Kim", "Kyounghun Lee"]
  tags: ["Machine Learning", "Biomedical", "Signal Processing"]
  doi: "10.1016/j.cmpb.2024.108079"
  arxiv: "2305.09368"
  abstract: "This study proposes an unsupervised sequence-to-sequence learning approach that automatically assesses the motion-induced reliability degradation of the cardiac volume signal (CVS) in multi-channel electrical impedance-based hemodynamic monitoring. By utilizing long-short term memory and variational auto-encoder structures, an encoder-decoder model is trained not only to self-reproduce an input sequence of the CVS but also to extrapolate the future in a parallel fashion."
  bibtex: |
    @article{hyun2024unsupervised,
      title={Unsupervised sequence-to-sequence learning for automatic signal quality assessment in multi-channel electrical impedance-based hemodynamic monitoring},
      author={Hyun, Chang Min and Kim, Tae-Geun and Lee, Kyounghun},
      journal={Computer Methods and Programs in Biomedicine},
      pages={108079},
      year={2024},
      doi={10.1016/j.cmpb.2024.108079}
    }

- title: "DeeLeMa: Missing information search with Deep Learning for Mass estimation"
  journal: "Phys. Rev. Research"
  year: 2023
  authors: ["Kayoung Ban", "Dong Woo Kang", "Tae-Geun Kim", "Seong Chan Park", "Yeji Park"]
  tags: ["Machine Learning", "Particle Physics", "Mass Estimation"]
  doi: "10.1103/PhysRevResearch.5.043186"
  arxiv: "2212.12836"
  code: "https://github.com/Yonsei-HEP-COSMO/DeeLeMa"
  abstract: "We introduce DeeLeMa, a deep learning-based network for the analysis of energy and momentum in high-energy particle collisions. This novel approach is specifically designed to address the challenge of analyzing collision events with multiple invisible particles, which are prevalent in many high-energy physics experiments. We show that DeeLeMa can robustly estimate mass distribution even in the presence of combinatorial uncertainties and detector smearing effects."
  bibtex: |
    @article{ban2023deelema,
      title={DeeLeMa: Missing information search with Deep Learning for Mass estimation},
      author={Ban, Kayoung and Kang, Dong Woo and Kim, Tae-Geun and Park, Seong Chan and Park, Yeji},
      journal={Physical Review Research},
      volume={5},
      number={4},
      pages={043186},
      year={2023},
      doi={10.1103/PhysRevResearch.5.043186}
    }
