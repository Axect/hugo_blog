description: "Dark matter phenomenology, AI for Science, and Science of AI"
description_ko: "암흑물질 현상학, 과학을 위한 인공지능, 그리고 인공지능의 과학"
research:
  - title: "Trustworthy neural samplers"
    title_ko: "신뢰할 수 있는 신경망 샘플러"
    text: "When can an autoregressive neural sampler be trusted for lattice spin systems? I study how much context a sampler needs given the structure of the interaction graph, and how to diagnose failures without exact reference data."
    text_ko: "자기회귀 신경망 샘플러는 격자 스핀계에서 언제 믿을 수 있을까? 상호작용 그래프의 구조에 비해 샘플러가 얼마나 넓은 문맥을 봐야 하는지, 그리고 정확한 기준값 없이 실패를 어떻게 진단할지를 연구합니다."
  - title: "Inverse problems and degeneracy"
    title_ko: "역문제와 축퇴"
    text: "Which parts of a physical model can data actually determine? With neural operators and identifiability analysis, I ask what gamma-ray spectra reveal about primordial black hole mass distributions, and which ultraviolet couplings SMEFT coefficients pin down."
    text_ko: "데이터는 물리 모형의 어디까지 결정할 수 있을까? 신경 연산자와 식별 가능성 분석으로, 감마선 스펙트럼이 원시블랙홀 질량분포에 대해 무엇을 알려 주는지, SMEFT 계수가 어떤 자외선 결합상수를 결정하는지를 연구합니다."
  - title: "Scientific machine learning and open-source tools"
    title_ko: "과학적 머신러닝과 오픈소스 도구"
    text: "Operator learning for Hamiltonian dynamics, learning-rate schedules that stay robust when the training budget changes, and numerical software for physicists, including the Rust library Peroxide."
    text_ko: "해밀턴 역학을 위한 연산자 학습, 학습 예산이 바뀌어도 안정적인 학습률 스케줄러, 그리고 Rust 수치계산 라이브러리 Peroxide를 비롯한 물리학자를 위한 수치계산 소프트웨어를 만듭니다."
